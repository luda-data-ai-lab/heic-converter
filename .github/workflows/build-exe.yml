name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build
      - run: uv run python packaging/version_info.py
      - run: uv run pyinstaller --noconfirm --distpath dist --workpath build packaging/HEICConverter.spec
      - name: Smoke test the exe
        shell: pwsh
        run: |
          .\dist\HEICConverter-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path dist\HEICConverter.exe)) { throw "GUI exe missing" }
          "{0:N1} MB GUI, {1:N1} MB CLI" -f ((Get-Item dist\HEICConverter.exe).Length / 1MB), ((Get-Item dist\HEICConverter-cli.exe).Length / 1MB)
          New-Item -ItemType Directory -Force smoke\사진 | Out-Null
          uv run python -c "import sys; sys.path.insert(0, '.'); from tests.conftest import make_heic; from pathlib import Path; make_heic(Path('smoke/사진/IMG_0001.HEIC'), gps=True, icc=True)"
          .\dist\HEICConverter-cli.exe smoke --no-pause --report smoke\report.csv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path smoke\사진\IMG_0001.jpg)) { throw "output missing" }
          Get-Content smoke\report.csv
      - name: Smoke test the GUI exe (window opens, converts a dropped folder, exits)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui-smoke\사진 | Out-Null
          Copy-Item smoke\사진\IMG_0001.HEIC gui-smoke\사진\
          $env:HEICCONV_SMOKE = "1"
          $env:HEICCONV_SETTINGS = "$PWD\gui-smoke\settings.json"
          $p = Start-Process dist\HEICConverter.exe -ArgumentList "`"$PWD\gui-smoke`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "GUI exe did not exit" }
          if ($p.ExitCode -ne 0) { throw "GUI exe exit code $($p.ExitCode)" }
          if (-not (Test-Path gui-smoke\사진\IMG_0001.jpg)) { throw "GUI output missing" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = uv run python -c "import heic_converter; print(heic_converter.__version__)"
          & $iscc /Qp "/DAppVersion=$v" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "SETUP=dist\HEICConverter-Setup-$v.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Smoke test the installer (install, right-click menu, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process $env:SETUP -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/TASKS=contextmenu", "/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup exit $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\HEIC Converter"
          if (-not (Test-Path "$app\HEICConverter.exe")) { throw "not installed to $app" }
          $key = "HKCU:\Software\Classes\Directory\shell\HEICConverter"
          (Get-ItemProperty $key).MUIVerb
          (Get-ItemProperty "$key\command").'(default)'
          if (-not (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.heic\shell\HEICConverter\command")) { throw "heic verb missing" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\HEICConverter.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\HEICConverter.exe") { throw "uninstall left files" }
          if (Test-Path $key) { throw "uninstall left the right-click menu" }
      - uses: actions/upload-artifact@v4
        with:
          name: HEICConverter-exe
          path: |
            dist/HEICConverter.exe
            dist/HEICConverter-cli.exe
            dist/HEICConverter-Setup-*.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HEICConverter.exe
            dist/HEICConverter-cli.exe
            dist/HEICConverter-Setup-*.exe
