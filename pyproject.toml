[project]
name = "heic-converter"
version = "0.1.0"
description = "Batch-convert iPhone HEIC/HEIF photos to JPG/PNG on Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LUDA Research Group", email = "contact@ludaresearch.org" }]
dependencies = [
    "pillow>=11.0,<12",
    "pillow-heif>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heic_converter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
