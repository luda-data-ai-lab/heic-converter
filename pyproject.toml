[project]
name = "heic-converter"
version = "0.4.0"
description = "Batch-convert iPhone HEIC/HEIF photos to JPG/PNG on Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LUDA Research Group", email = "contact@ludaresearch.org" }]
dependencies = [
    "pillow>=11.0,<12",
    "pillow-heif>=1.0,<2",
    "pyside6-essentials>=6.8,<7",
]

[project.scripts]
heic-convert = "heic_converter.cli:main"

[project.gui-scripts]
heic-converter = "heic_converter.gui.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.8"]
build = ["pyinstaller>=6.10,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heic_converter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/heic_converter/i18n/__init__.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
